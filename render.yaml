# Render Blueprint: one web service = API + React app.
services:
  - type: web
    name: resume-builder
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you type the value in the Render dashboard
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: resume_builder
      - key: TRUST_PROXY
        value: "true"
